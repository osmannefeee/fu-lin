<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çok Yakında Geri Dönüyoruz!</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        .badge {
            display: inline-block;
            background-color: #3b82f6;
            color: white;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 6px 14px;
            border-radius: 50px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #ffffff;
        }
        p {
            font-size: 16px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .contact-box {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
            font-size: 14px;
            color: #cbd5e1;
        }
        .contact-box a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
        }
        .contact-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">Bakım Modu</div>
        <h1>Çok Yakında Buradayız!</h1>
        <p>İnternet sitemizde şu anda bazı geliştirmeler ve yenilikler yapıyoruz. Çok daha güçlü bir şekilde, en kısa sürede yeniden karşınızda olacağız. Anlayışınız için teşekkür ederiz.</p>

        <div class="contact-box">
            Bize ulaşmak isterseniz: <a href="mailto:fulinyazilim@outlook.com">fulinyazilim@outlook.com</a>
        </div>
    </div>

</body>
</html>
